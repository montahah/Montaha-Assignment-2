<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Montaha-Assignment-2</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header Section -->
    <header>
      <nav class="navbar">
        <div class="nav-logo">
          <img src="./assets/TechWave.png" alt="techwave logo" />
          <!-- <h3>Tech<span>Wave</span></h3> -->
        </div>
        <div class="nav-menu">
          <ul class="menu-links">
            <li class="menu-items"><a href="#" class="menu-link">About</a></li>
            <li class="menu-items">
              <a href="#" class="menu-link">Episodes</a>
            </li>
            <li class="menu-items"><a href="#" class="menu-link">Host</a></li>
          </ul>
        </div>
        <div class="nav-button btn">
          Subscribe <i class="fa-solid fa-arrow-right"></i>
        </div>
        <div class="hamburger">
          <img src="./assets/hamburger-menu.png" alt="Hamburger logo" />
        </div>
      </nav>
      <section class="banner">
        <div class="banner-container">
          <div class="banner-images">
            <div class="mic-images">
              <img class="img-mic" src="./assets/microphone.png" alt="" />
              <img
                class="img-circle"
                src="./assets/hero-circle.png"
                alt="hero circle" />
              <div class="badge">NEW</div>
            </div>
          </div>
          <div class="banner-content">
            <h1 class="banner-title">TechWave</h1>
            <p class="banner-description">
              Your daily dose of tech insights, productivity hacks, and personal
              growth
            </p>
            <div class="banner-buttons">
              <button class="btn banner-button1">
                <i class="fa-brands fa-spotify"></i> Listen on Spotify</button
              ><button class="btn banner-button2">
                <img src="./assets/message.png" alt="" /> Subscribe
              </button>
            </div>
          </div>
        </div>
      </section>
    </header>
    <!-- Main Body Section -->
    <main></main>
    <!-- Footer Section -->
    <footer></footer>
  </body>
</html>
